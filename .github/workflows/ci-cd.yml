name: ResuMatch CI/CD Production Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-build-test:
    name: Backend Build & Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run Unit Tests
        run: |
          cd backend
          mvn clean test

      - name: Build Production JAR
        run: |
          cd backend
          mvn package -DskipTests

  frontend-build-test:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Verify TypeScript & Build Bundle
        run: |
          cd frontend
          npx tsc --noEmit
          npm run build

  docker-build:
    name: Build & Verify Docker Images
    needs: [backend-build-test, frontend-build-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t resumatch-backend:latest -f docker/Dockerfile.backend ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t resumatch-frontend:latest -f docker/Dockerfile.frontend ./frontend
